# Unsigned installers. No publish target, no auto-update, no code signing (spec: out of scope
# for milestone 1). `npm run dist` builds for the current operating system.
appId: tech.wildflowers.wildkids.computers
productName: Wild Kids - Computers
copyright: Copyright 2026 Wild Flowers Tech
artifactName: wild-kids-computers-${version}-${os}-${arch}.${ext}

directories:
  output: release

# Everything the app runs is bundled into dist/, so no node_modules ship.
files:
  - dist/electron/**
  - dist/renderer/**
  - package.json
  - '!node_modules/**'
# A copy of the third-party notices beside the program files, as Electron ships its own LICENSE
# and LICENSES.chromium.html. The parent corner shows the copy inside the renderer build. The
# renderer build writes this copy outside dist/renderer, because electron-builder moves an
# extraResources source out of app.asar.
extraResources:
  - from: dist/notices/third-party-notices.txt
    to: third-party-notices.txt
  # The window icon on Linux. tools/renderAppIcon.ts draws it.
  - from: build/icons/256x256.png
    to: icon.png
asar: true
npmRebuild: false
publish: null

# Hardening for the packaged app. End-to-end tests run unpackaged, so these never affect them.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses breaks the ad hoc signature an unsigned arm64 macOS app needs to launch.
  resetAdHocDarwinSignature: true

mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  identity: null

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# The AppImage uses the static type 2 runtime, which mounts with FUSE 3 and needs no libfuse2.
toolsets:
  appimage: '1.0.3'

# One name everywhere on Linux: the package, the command, the icon, the desktop entry, and the
# window's Wayland app id and X11 class, which Electron takes from desktopName in package.json.
linux:
  target:
    - AppImage
    - pacman
    - deb
    - rpm
    - tar.gz
  executableName: wild-kids-computers
  syncDesktopName: true
  category: Education;Game;KidsGame
  synopsis: Children learn to use a computer by playing and painting
  maintainer: Wild Flowers Tech
  vendor: Wild Flowers Tech
  desktop:
    entry:
      Keywords: kids;children;learning;paint;mouse;keyboard;typing;

# Each list names what the program files link against directly, read with readelf from the
# Electron binary, so a minimal system gets every library the app loads at start. tools/packaging
# installs each package on a minimal image of its distribution and launches it.
#
# Debian 13 and Ubuntu 24.04 renamed several libraries with a t64 suffix, so each names the new
# package first and the old one for Debian 12 and Ubuntu 22.04. The old name alone is not enough:
# on a minimal Ubuntu 24.04, apt satisfied a bare libasound2 with liboss4-salsa-asound2, which
# lacks ALSA symbols Electron needs, and the app could not start.
pacman:
  afterInstall: packaging/linux/after-install.tpl
  afterRemove: packaging/linux/after-remove.tpl
  artifactName: ${name}-${version}-1-x86_64.pkg.tar.zst
  compression: zstd
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - dbus
    - expat
    - glib2
    - glibc
    - gtk3
    - libcups
    - libgcc
    - libpulse
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - systemd-libs
  fpm:
    - --after-upgrade
    - packaging/linux/pacman-after-upgrade.sh
    - LICENSE=/usr/share/licenses/wild-kids-computers/LICENSE

deb:
  afterInstall: packaging/linux/after-install.tpl
  afterRemove: packaging/linux/after-remove.tpl
  depends:
    - 'libasound2t64 | libasound2'
    - 'libatk-bridge2.0-0t64 | libatk-bridge2.0-0'
    - 'libatk1.0-0t64 | libatk1.0-0'
    - 'libatspi2.0-0t64 | libatspi2.0-0'
    - libc6
    - libcairo2
    - 'libcups2t64 | libcups2'
    - libdbus-1-3
    - libexpat1
    - libgbm1
    - libgcc-s1
    - 'libglib2.0-0t64 | libglib2.0-0'
    - 'libgtk-3-0t64 | libgtk-3-0'
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libpulse0
    - libudev1
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  recommends: []
  fpm:
    - LICENSE=/usr/share/doc/wild-kids-computers/copyright

# Library names rather than package names, as rpm's own dependency generator writes them, so one
# list resolves on Fedora and openSUSE alike.
rpm:
  afterInstall: packaging/linux/after-install.tpl
  afterRemove: packaging/linux/after-remove.tpl
  depends:
    - libasound.so.2()(64bit)
    - libatk-1.0.so.0()(64bit)
    - libatk-bridge-2.0.so.0()(64bit)
    - libatspi.so.0()(64bit)
    - libcairo.so.2()(64bit)
    - libcups.so.2()(64bit)
    - libdbus-1.so.3()(64bit)
    - libexpat.so.1()(64bit)
    - libgbm.so.1()(64bit)
    - libgcc_s.so.1()(64bit)
    - libgio-2.0.so.0()(64bit)
    - libglib-2.0.so.0()(64bit)
    - libgobject-2.0.so.0()(64bit)
    - libgtk-3.so.0()(64bit)
    - libnspr4.so()(64bit)
    - libnss3.so()(64bit)
    - libnssutil3.so()(64bit)
    - libpango-1.0.so.0()(64bit)
    - libpulse.so.0()(64bit)
    - libsmime3.so()(64bit)
    - libudev.so.1()(64bit)
    - libX11.so.6()(64bit)
    - libxcb.so.1()(64bit)
    - libXcomposite.so.1()(64bit)
    - libXdamage.so.1()(64bit)
    - libXext.so.6()(64bit)
    - libXfixes.so.3()(64bit)
    - libxkbcommon.so.0()(64bit)
    - libXrandr.so.2()(64bit)
  fpm:
    # fpm lists only files, so rpm would leave the app's empty folders behind on removal.
    - --rpm-auto-add-directories
    - LICENSE=/usr/share/licenses/wild-kids-computers/LICENSE
