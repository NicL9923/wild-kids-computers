# Headless sway for the end-to-end specs. The specs size the window themselves, which a tiled
# window ignores, so the app's windows float here as on a stacking desktop. The package checks use
# sway.conf, which tiles, as Omarchy does.
xwayland disable
output HEADLESS-1 resolution 1920x1200 scale 1
default_border none
default_floating_border none
for_window [app_id="wild-kids-computers"] floating enable
