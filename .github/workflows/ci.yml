name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A version tag also drafts a GitHub release once every job passes. See the release job.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The changes job decides whether the heavy jobs run. Docs-only changes skip them. A job
# skipped by its `if` reports "skipped", which satisfies a required check. Lint, format, and
# type check always run, because they also check Markdown formatting.
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A manual run and a release tag run everything.
      code: ${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && 'true' || steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed paths
        if: github.ref_type != 'tag'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Every pattern must match, so a file counts as code unless it is documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  static:
    name: Lint, format, and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run format:check
      - run: npm run typecheck
      - name: Lint workflows
        # rhysd/actionlint 1.7.12, pinned by its multi-architecture index digest.
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color .github/workflows/ci.yml

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Unit tests in UTC
        run: npm test
      - name: Unit tests east of UTC
        run: npm run test:tz

  check:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: End-to-end tests (Electron)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Nearly 500 tests run one at a time, about 20 minutes on a fast machine.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and Chromium's
      # sandbox needs them. Tests never pass --no-sandbox.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
      # The default virtual screen is smaller than the 1920 by 1080 review window and clips it.
      - name: Run Electron tests under a virtual display
        run: xvfb-run -a -s "-screen 0 1920x1200x24" npm run e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  browser:
    name: Browser build test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run e2e:browser
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  installers:
    name: Unsigned installer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # electron-builder's pacman target packs with bsdtar, and its rpm target needs rpmbuild.
      - name: Install the Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libarchive-tools rpm
      - name: Build the installer
        run: npm run dist
        env:
          # No signing in milestone 1. This stops electron-builder looking for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The third-party notices ship inside app.asar for the parent corner and beside the program
      # files. On Linux the check also opens the AppImage itself.
      - name: Check the packaged notices
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            extracted="$(mktemp -d)"
            appimages=("$GITHUB_WORKSPACE"/release/*.AppImage)
            (cd "$extracted" && "${appimages[0]}" --appimage-extract > /dev/null)
            npm run check:packaged-notices -- "$extracted/squashfs-root"
          fi
          npm run check:packaged-notices
      # Each Linux package's desktop entry, icons, license, notices, metadata, and sandbox helper.
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: node tools/packaging/checkLinuxPackages.ts release
      # Start each packaged build with no test hook and fail if it dies or logs a fatal error. On
      # Linux the .deb is installed first, so the app runs from /opt under the AppArmor profile the
      # package installs, with Ubuntu's user namespace restriction left on and the sandbox on.
      - name: Start the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --yes ./release/*.deb
          test -f /etc/apparmor.d/wild-kids-computers
          xvfb-run -a -s "-screen 0 1920x1200x24" \
            node tools/packaging/smokeLaunch.ts "/opt/Wild Kids - Computers/wild-kids-computers"
      - name: Start the packaged app (macOS)
        if: runner.os == 'macOS'
        run: node tools/packaging/smokeLaunch.ts "release/mac-arm64/Wild Kids - Computers.app/Contents/MacOS/Wild Kids - Computers"
      - name: Start the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node tools/packaging/smokeLaunch.ts "release/win-unpacked/Wild Kids - Computers.exe"
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.pkg.tar.zst
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  # Runs only for a pushed v* tag, after every other job passed. It checks that the tag names the
  # package.json version, writes SHA256SUMS over every installer, and creates a draft release. A
  # person reviews the draft and publishes it. This is the only job that can write to the repo.
  release:
    name: Draft the GitHub release
    needs: [static, unit, check, e2e, browser, installers]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The release scripts use only Node's own modules, so this job needs no npm ci.
      - name: Check the tag names the package.json version
        run: node tools/packaging/release.ts tag "$GITHUB_REF_NAME"
      - name: Download the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-files
      - name: Write SHA256SUMS
        run: node tools/packaging/release.ts checksums release-files
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-files/*
          --draft --verify-tag
          --title "Wild Kids - Computers ${GITHUB_REF_NAME#v}"
          --notes-file packaging/release-notes.md
